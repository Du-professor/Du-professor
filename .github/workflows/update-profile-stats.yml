name: Update profile stats

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6

      - name: Fetch public GitHub statistics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -F login="$PROFILE_LOGIN" \
            -f query='query($login: String!) {
              user(login: $login) {
                login
                name
                followers { totalCount }
                repositories(ownerAffiliations: OWNER, privacy: PUBLIC) { totalCount }
                pullRequests { totalCount }
                issues { totalCount }
                contributionsCollection {
                  contributionCalendar { totalContributions }
                  totalCommitContributions
                  totalIssueContributions
                  totalPullRequestContributions
                  totalPullRequestReviewContributions
                }
              }
            }' > "$RUNNER_TEMP/profile-stats.json"

      - name: Render static SVG
        run: >-
          python scripts/render_stats.py
          "$RUNNER_TEMP/profile-stats.json"
          assets/github-stats.svg

      - name: Commit updated card
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- assets/github-stats.svg)" ]]; then
            echo "GitHub stats card is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/github-stats.svg
          git commit -m "chore: update profile stats"
          git push
