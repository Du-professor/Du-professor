<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title description">
  <title id="title">Du-professor GitHub statistics</title>
  <desc id="description">Public GitHub activity statistics refreshed weekly.</desc>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .heading { fill: #24292f; font: 600 18px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
    .value { fill: #0969da; font: 600 17px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
    .label { fill: #57606a; font: 12px -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .heading { fill: #e6edf3; }
      .value { fill: #58a6ff; }
      .label { fill: #8b949e; }
    }
  </style>
  <rect class="card" width="494" height="194" x="0.5" y="0.5" rx="6"/>
  <text class="heading" x="25" y="39">Du-professor's GitHub Stats</text>
  <text class="value" x="25" y="88">42</text><text class="label" x="25" y="108">Contributions</text><text class="value" x="183" y="88">5</text><text class="label" x="183" y="108">Repositories</text><text class="value" x="341" y="88">3</text><text class="label" x="341" y="108">Pull requests</text><text class="value" x="25" y="149">1</text><text class="label" x="25" y="169">Issues</text><text class="value" x="183" y="149">0</text><text class="label" x="183" y="169">Reviews</text><text class="value" x="341" y="149">1</text><text class="label" x="341" y="169">Followers</text>
</svg>
